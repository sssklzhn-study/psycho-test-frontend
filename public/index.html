<head>

  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

  <title>PsychoTest | Премиальное психологическое тестирование</title>
  
  <!-- Премиальные шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Премиальный сплеш-скрин в новом дизайне -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0B1026;
      color: white;
    }
    
    /* Премиальный экран загрузки - глубокий синий с золотом */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #0B1026 0%, #1A1F35 50%, #232842 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Плавающие фоновые элементы */
    .splash-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    
    .splash-orb-1 {
      width: 600px;
      height: 600px;
      top: -200px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.12), rgba(255, 215, 0, 0) 70%);
      animation: orbFloat 20s ease-in-out infinite;
    }
    
    .splash-orb-2 {
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -100px;
      background: radial-gradient(circle at 70% 70%, rgba(100, 150, 255, 0.15), rgba(100, 150, 255, 0) 70%);
      animation: orbFloat 25s ease-in-out infinite reverse;
    }
    
    .splash-orb-3 {
      width: 400px;
      height: 400px;
      top: 40%;
      right: 20%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08), rgba(255, 215, 0, 0) 70%);
      animation: orbFloat 18s ease-in-out infinite;
    }
    
    /* Геометрическая сетка */
    .splash-grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 215, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    
    /* Золотые линии */
    .splash-line {
      position: absolute;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 215, 0, 0.3), 
        rgba(255, 215, 0, 0.5), 
        rgba(255, 215, 0, 0.3), 
        transparent
      );
      height: 1px;
      width: 100%;
      top: 30%;
      transform: rotate(-2deg);
      animation: goldShimmer 4s ease-in-out infinite;
    }
    
    .splash-line-2 {
      position: absolute;
      background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 215, 0, 0.2), 
        rgba(255, 215, 0, 0.3), 
        rgba(255, 215, 0, 0.2), 
        transparent
      );
      height: 1px;
      width: 80%;
      bottom: 20%;
      right: 0;
      transform: rotate(3deg);
      animation: goldShimmer 6s ease-in-out infinite reverse;
    }
    
    /* Логотип контейнер */
    .splash-logo {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      z-index: 10;
    }
    
    /* Золотой круг */
    .splash-circle {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 50%;
      animation: rotate 10s linear infinite;
    }
    
    .splash-circle-2 {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 90px;
      height: 90px;
      border: 2px solid rgba(255, 215, 0, 0.2);
      border-radius: 50%;
      border-top-color: #FFD700;
      border-right-color: #FFD700;
      animation: rotate 8s linear infinite reverse;
    }
    
    .splash-circle-3 {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 60px;
      height: 60px;
      border: 2px solid rgba(255, 215, 0, 0.15);
      border-radius: 50%;
      border-bottom-color: #FFD700;
      border-left-color: #FFD700;
      animation: rotate 6s linear infinite;
    }
    
    /* Иконка мозга/психологии */
    .splash-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      line-height: 1;
      animation: glow 3s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
    }
    
    /* Текст */
    .splash-title {
      font-size: 36px;
      font-weight: 600;
      background: linear-gradient(135deg, #FFFFFF, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      font-family: 'Playfair Display', serif;
      z-index: 10;
      position: relative;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
    }
    
    .splash-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin: 0 0 40px 0;
      font-weight: 300;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 10;
      position: relative;
    }
    
    /* Премиум прогресс бар */
    .splash-progress-container {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 215, 0, 0.1);
    }
    
    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      border-radius: 4px;
      animation: progress 1.8s ease-in-out forwards;
      position: relative;
      overflow: hidden;
    }
    
    .splash-progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s ease-in-out infinite;
    }
    
    /* Статус */
    .splash-status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      z-index: 10;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .splash-status-dot {
      width: 6px;
      height: 6px;
      background: #FFD700;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    /* Анимации */
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(2%, 2%) scale(1.05); }
      66% { transform: translate(-2%, 1%) scale(0.95); }
    }
    
    @keyframes goldShimmer {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5)); }
      50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    
    /* Сообщение для отключенного JS */
    .noscript-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #0B1026 0%, #1A1F35 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20000;
    }
    
    .noscript-card {
      background: rgba(26, 31, 53, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 215, 0, 0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .noscript-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #FFD700, transparent);
      animation: borderGlow 3s ease-in-out infinite;
    }
    
    .noscript-icon {
      font-size: 56px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
    }
    
    .noscript-title {
      background: linear-gradient(135deg, #FFFFFF, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    
    .noscript-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .noscript-button {
      display: inline-block;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #0B1026;
      text-decoration: none;
      padding: 14px 35px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      position: relative;
      overflow: hidden;
    }
    
    .noscript-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }
    
    .noscript-button:hover::before {
      left: 100%;
    }
    
    .noscript-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(255, 215, 0, 0.3);
    }
    
    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    /* Адаптивность */
    @media (max-width: 768px) {
      .splash-logo {
        width: 100px;
        height: 100px;
      }
      
      .splash-circle-2 {
        width: 70px;
        height: 70px;
        top: 15px;
        left: 15px;
      }
      
      .splash-circle-3 {
        width: 40px;
        height: 40px;
        top: 30px;
        left: 30px;
      }
      
      .splash-icon {
        font-size: 40px;
      }
      
      .splash-title {
        font-size: 30px;
      }
      
      .splash-subtitle {
        font-size: 14px;
      }
      
      .splash-progress-container {
        width: 240px;
      }
      
      .noscript-card {
        padding: 30px 20px;
      }
    }
    
    @media (max-width: 480px) {
      .splash-logo {
        width: 80px;
        height: 80px;
      }
      
      .splash-circle-2 {
        width: 50px;
        height: 50px;
        top: 15px;
        left: 15px;
      }
      
      .splash-circle-3 {
        width: 30px;
        height: 30px;
        top: 25px;
        left: 25px;
      }
      
      .splash-icon {
        font-size: 32px;
      }
      
      .splash-title {
        font-size: 26px;
      }
      
      .splash-subtitle {
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      
      .splash-progress-container {
        width: 200px;
      }
      
      .noscript-title {
        font-size: 22px;
      }
      
      .noscript-text {
        font-size: 14px;
      }
    }
    
    /* Уменьшение анимаций */
    @media (prefers-reduced-motion: reduce) {
      .splash-orb-1,
      .splash-orb-2,
      .splash-orb-3,
      .splash-circle,
      .splash-circle-2,
      .splash-circle-3,
      .splash-icon,
      .splash-progress-fill::after,
      .splash-line,
      .splash-line-2,
      .splash-status-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <!-- Премиальный экран загрузки в новом дизайне -->
  <div id="splash-screen">
    <!-- Фоновые элементы -->
    <div class="splash-orb splash-orb-1"></div>
    <div class="splash-orb splash-orb-2"></div>
    <div class="splash-orb splash-orb-3"></div>
    <div class="splash-grid"></div>
    <div class="splash-line"></div>
    <div class="splash-line-2"></div>
    
    <!-- Логотип -->
    <div class="splash-logo">
      <div class="splash-circle"></div>
      <div class="splash-circle-2"></div>
      <div class="splash-circle-3"></div>
      <div class="splash-icon">🧠</div>
    </div>
    
    <!-- Текст -->
    <h1 class="splash-title">PsychoTest</h1>
    <p class="splash-subtitle">премиальное тестирование</p>
    
    <!-- Прогресс бар -->
    <div class="splash-progress-container">
      <div class="splash-progress-fill"></div>
    </div>
    
    <!-- Статус -->
    <div class="splash-status">
      <span>инициализация системы</span>
      <div class="splash-status-dot"></div>
    </div>
  </div>

  <!-- Сообщение для пользователей с отключенным JS -->
  <noscript>
    <div class="noscript-container">
      <div class="noscript-card">
        <div class="noscript-icon">⚠️</div>
        <h2 class="noscript-title">JavaScript отключен</h2>
        <p class="noscript-text">
          Для работы премиальной системы психологического тестирования необходимо включить JavaScript в настройках вашего браузера.
        </p>
        <a href="https://www.enable-javascript.com/ru/" target="_blank" rel="noopener noreferrer" class="noscript-button">
          Инструкция
        </a>
      </div>
    </div>
  </noscript>

  <!-- Корневой элемент React -->
  <div id="root"></div>

  <!-- Элегантное скрытие сплеш-скрина -->
  <script>
    (function() {
      // Функция для скрытия сплеш-скрина
      function hideSplash() {
        var splash = document.getElementById('splash-screen');
        if (!splash) return;
        
        // Добавляем класс для плавного исчезновения
        splash.style.opacity = '0';
        
        // Полностью убираем из DOM после анимации
        setTimeout(function() {
          splash.style.display = 'none';
          
          // Показываем контент
          document.body.style.overflow = 'auto';
        }, 500);
      }
      
      // Скрываем после полной загрузки страницы
      window.addEventListener('load', function() {
        // Даем время на анимацию прогресс-бара
        setTimeout(hideSplash, 2000);
      });
      
      // Если React загрузился быстрее - скрываем
      window.addEventListener('react-loaded', function() {
        hideSplash();
      });
      
      // Запасной вариант - скрываем через 3.5 секунды в любом случае
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash && splash.style.display !== 'none') {
          hideSplash();
        }
      }, 3500);
      
      // Показываем сплеш-скрин сразу
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.display = 'flex';
      }
    })();
  </script>
  
  <!-- Уведомление о загрузке React -->
  <script>
    // Диспатчим событие, когда React загрузился
    window.onload = function() {
      // Небольшая задержка для React
      setTimeout(function() {
        if (document.getElementById('root').children.length > 0) {
          window.dispatchEvent(new Event('react-loaded'));
        }
      }, 100);
    };
  </script>
</body>
</html>
